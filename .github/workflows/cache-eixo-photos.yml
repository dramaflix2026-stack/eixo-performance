name: Cache EIXO editorial photos
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/cache-eixo-photos.yml"
permissions:
  contents: write
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and validate local photographs
        run: |
          python3 - <<'PY'
          import urllib.request, os, time
          from concurrent.futures import ThreadPoolExecutor
          os.makedirs('public/images',exist_ok=True)
          assets = {
            'hero.jpg': [
              'https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=1100&q=82',
              'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=1100&q=82',
              'https://images.pexels.com/photos/5490236/pexels-photo-5490236.jpeg?w=1100'
            ],
            'pressao.jpg': [
              'https://images.pexels.com/photos/17026670/pexels-photo-17026670.jpeg?w=800',
              'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=800&q=80'
            ],
            'clareza.jpg': [
              'https://images.pexels.com/photos/20022690/pexels-photo-20022690.jpeg?w=800',
              'https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=800&q=80'
            ],
            'partida.jpg': [
              'https://images.pexels.com/photos/5490236/pexels-photo-5490236.jpeg?w=800',
              'https://images.unsplash.com/photo-1560250097-0b93528c311a?w=800&q=80'
            ]
          }
          def grab(item):
            name,urls=item
            for url in urls:
              for attempt in range(2):
                try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 EIXO Site Image Cache'})
                  with urllib.request.urlopen(req,timeout=30) as response:
                    data=response.read()
                    typ=response.headers.get('Content-Type','')
                  if len(data)<15000 or not data.startswith(bytes.fromhex('ffd8ff')):raise ValueError(f'Invalid JPEG ({len(data)} bytes; {typ})')
                  with open('public/images/'+name,'wb') as out:out.write(data)
                  print(name,'OK',len(data),url)
                  return
                except Exception as exc:
                  print(name,'retry',attempt,str(exc))
                  time.sleep(2)
            raise RuntimeError('Could not download '+name)
          with ThreadPoolExecutor(max_workers=4) as pool:list(pool.map(grab,assets.items()))
          PY
      - name: Commit photos to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/
          if ! git diff --cached --quiet; then
            git commit -m "assets: vendor validated editorial photographs locally"
            git push
          fi
